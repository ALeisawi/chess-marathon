<script>
// =====================================================================================
//  CHESS MARATHON v3.0.0 (phone build)
//  Sections:
//   1. PLATFORM: environment guards, storage
//   2. RULES: every game rule and the game state (S). Rules never draw. They report
//      what happened through emit(event, data), and the presentation layer reacts.
//      To change the rules, edit RULES and the functions in section 2 only.
//   3. SETTINGS, AUDIO, HAPTICS
//   4. THEMES
//   5. LAYOUT: real viewport, safe areas, devicePixelRatio
//   6. ART: vector pieces, tiles, sprite cache
//   7. VIEW STATE + FX: reactions to rule events (particles, tweens, tips...)
//   8. RENDER
//   9. INPUT
//  10. UPDATE CHECK (version.json)
//  11. LOOP + BOOT
//  (4b. RUN STATS: run history + lifetime totals in localStorage, listens to rule events)
//  The bot harness needs these top-level globals: S, newGame, playerMoves, tryMove,
//  isDanger, waitTurn, update, draw.
// =====================================================================================

const APP_VERSION = '3.1.0';

// ===================================== 1. PLATFORM =====================================
const HAS_WIN = typeof window !== 'undefined';
const HAS_DOC = typeof document !== 'undefined';
const NAV = typeof navigator !== 'undefined' ? navigator : null;
// home-screen app: iOS draws white status text over our page (black-translucent), so light themes need a dark strip
const STANDALONE = !!((NAV && NAV.standalone) || (HAS_WIN && window.matchMedia && (() => { try { return window.matchMedia('(display-mode: standalone)').matches; } catch (e) { return false; } })()));
function load(k, d) { try { const v = localStorage.getItem(k); return v === null || v === undefined ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return n >>> 0; }

// event bus: rules -> presentation
const FX = {}, HOOKS = {};
function on(name, fn) { (HOOKS[name] = HOOKS[name] || []).push(fn); }
function emit(name, d) {
  d = d || {};
  const hs = HOOKS[name]; if (hs) for (const h of hs) { try { h(d); } catch (e) { if (typeof console !== 'undefined') console.error(e); } }
  const f = FX[name]; if (f) { try { f(d); } catch (e) { if (typeof console !== 'undefined') console.error(e); } }
}

// ======================================= 2. RULES ======================================
// v3 "Become what you take" (design.md / designer_sandbox/v3.js)
const RULES = {
  cols: 7, ranks: 1000,
  view: 10,               // ranks in play (black only moves inside them, spawns happen as they reveal)
  behind: 3,              // camera keeps the player 3 ranks from the bottom of the play window
  goldEvery: 10,          // rank 10, 20, 30... any non-queen landing there (first time) becomes a queen
  lives: 3, lifeEvery: 50,
  blackDelay: 0.18,       // black answers 0.18 s after your move
  waitDelay: 0.12,
  hitDelay: 0.25,         // the attacker's line is shown this long before a capture resolves
  hunt: r => r < 10 ? 4 : 20,
  voidStart: -3,
  voidSpeed: r => r < 30 ? 0.6 : r < 150 ? 0.75 : 0.9,
  voidMaxGap: 4, voidReset: 3, voidNear: 2.5,
  spawnChance: n => n <= 30 ? 0.5 : n <= 100 ? 0.65 : 0.8,
  spawnExtra: n => n > 100 ? Math.min(0.5, (n - 100) / 800) : 0,
  typeWeights: n => {
    const pool = [['pawn', n <= 30 ? 4 : 6], ['knight', 3]];
    if (n > 20) pool.push(['bishop', 2]);
    if (n > 30) pool.push(['rook', 2]);
    if (n > 60) pool.push(['queen', 0.5 + n / 400]);
    return pool;
  },
  downgrade: { queen: 'rook', rook: 'knight', bishop: 'pawn', knight: 'pawn' },
  points: { rank: 10, promote: 50, fell: 5, capture: 10 },
  closeCallEvery: 6,
  // hand-placed ranks 1-10 (r is 0-based). Nothing attacks d2/c1/e1 at start.
  opening: [['pawn', 3, 1], ['knight', 4, 3], ['pawn', 5, 5], ['bishop', 6, 2], ['pawn', 7, 5], ['rook', 8, 0]],
  // scripted black replies for turns 1-2 (used only if legal, else normal AI)
  script: [{ f: [4, 3], t: [2, 4], need: [1, 3] },   // after d1-d2: Nd5-e3 offers itself
           { f: [6, 2], t: [5, 1], need: [2, 4] }],  // after dxe3: Bc7-b6 attacks your knight -> first close call
};
const PIECES = { pawn: { value: 1 }, knight: { value: 3 }, bishop: { value: 3 }, rook: { value: 5 }, queen: { value: 9 } };
const PIECE_TYPES = ['pawn', 'knight', 'bishop', 'rook', 'queen'];   // also the order of "highest piece reached"
const COLS = RULES.cols, RANKS = RULES.ranks, VIEW = RULES.view, BEHIND = RULES.behind;
const KNIGHT_JUMPS = [[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];
const DIAG = [[1,1],[1,-1],[-1,1],[-1,-1]];
const ORTHO = [[1,0],[-1,0],[0,1],[0,-1]];
const dirsFor = (t) => t === 'rook' ? ORTHO : t === 'bishop' ? DIAG : DIAG.concat(ORTHO);
let BEST = load('cm_best2', 0);   // best rank, 1-based

let S;
function newGame() {
  S = {
    player: { type: 'pawn', r: 0, c: 3 },
    enemies: new Map(),
    score: 0, best: 0, revealed: 0, lives: RULES.lives,
    collapse: RULES.voidStart,           // every rank at or below this has fallen into the void
    combo: 0, state: 'play', msg: '', blocked: false,
    blackAt: 0, hit: null, lastMove: null, time: 0,
    turn: 0, grace: 0, moves: 0, lastClose: -99, closeCalls: 0, captures: 0,
    startBest: BEST, newBest: false, killer: null,
    // per-run counters (read by the stats screen)
    taken: { pawn: 0, knight: 0, bishop: 0, rook: 0, queen: 0 }, maxCombo: 0, queens: 0, topPiece: 'pawn', queenTurn: 0, waits: 0,
  };
  for (const [t, r, c] of RULES.opening) S.enemies.set(key(r, c), mk(t, r, c));
  S.revealed = 9;
  for (let rk = 10; rk <= topRank(); rk++) spawnRank(rk);
  S.revealed = Math.max(9, topRank());
  emit('newgame');
}

const key = (r, c) => r + ',' + c;
const enemyAt = (r, c) => S.enemies.get(key(r, c));
const onBoard = (r, c) => r >= 0 && r < RANKS && c >= 0 && c < COLS;
const camTarget = () => Math.max(0, Math.min(RANKS - VIEW, S.player.r - BEHIND));
const topRank = () => Math.min(RANKS - 1, camTarget() + VIEW - 1);
const voidEdge = () => Math.floor(S.collapse);
const inView = (r) => r >= camTarget() && r <= topRank() && r > voidEdge();
const isGoldRank = (r) => (r + 1) % RULES.goldEvery === 0;
const mk = (type, r, c) => ({ type, r, c });

// ---- white (you): plain chess; the marathon pawn may also step sideways, no double step
function playerMoves() {
  const p = S.player, out = [];
  const ok = (r, c) => onBoard(r, c) && inView(r);
  if (p.type === 'pawn') {
    if (ok(p.r + 1, p.c) && !enemyAt(p.r + 1, p.c)) out.push({ r: p.r + 1, c: p.c });
    for (const dc of [-1, 1]) if (enemyAt(p.r + 1, p.c + dc)) out.push({ r: p.r + 1, c: p.c + dc });
    for (const dc of [-1, 1]) if (ok(p.r, p.c + dc) && !enemyAt(p.r, p.c + dc)) out.push({ r: p.r, c: p.c + dc });
    return out;
  }
  if (p.type === 'knight') {
    for (const [a, b] of KNIGHT_JUMPS) if (ok(p.r + a, p.c + b)) out.push({ r: p.r + a, c: p.c + b });
    return out;
  }
  for (const [a, b] of dirsFor(p.type)) {
    let r = p.r + a, c = p.c + b;
    while (ok(r, c)) { out.push({ r, c }); if (enemyAt(r, c)) break; r += a; c += b; }
  }
  return out;
}
// squares the player could capture on (black avoids them)
function playerThreats() {
  const p = S.player, set = new Set();
  if (p.type === 'pawn') { set.add(key(p.r + 1, p.c - 1)); set.add(key(p.r + 1, p.c + 1)); return set; }
  if (p.type === 'knight') { for (const [a, b] of KNIGHT_JUMPS) set.add(key(p.r + a, p.c + b)); return set; }
  for (const [a, b] of dirsFor(p.type)) {
    let r = p.r + a, c = p.c + b;
    while (onBoard(r, c)) { set.add(key(r, c)); if (enemyAt(r, c)) break; r += a; c += b; }
  }
  return set;
}

// ---- black: plays down the board
function attacks(e, r, c) {
  const dr = r - e.r, dc = c - e.c;
  if (!dr && !dc) return false;
  if (e.type === 'pawn') return dr === -1 && Math.abs(dc) === 1;
  if (e.type === 'knight') return Math.abs(dr * dc) === 2;
  const diag = Math.abs(dr) === Math.abs(dc), line = !dr || !dc;
  if ((e.type === 'bishop' && !diag) || (e.type === 'rook' && !line) || (e.type === 'queen' && !diag && !line)) return false;
  const sr = Math.sign(dr), sc = Math.sign(dc);
  for (let x = e.r + sr, y = e.c + sc; x !== r || y !== c; x += sr, y += sc) if (enemyAt(x, y)) return false;
  return true;
}
function isDanger(r, c) {
  for (const e of S.enemies.values()) if (!(e.r === r && e.c === c) && attacks(e, r, c)) return true;
  return false;
}
function attackersOf(r, c) {
  const out = [];
  for (const e of S.enemies.values()) if (!(e.r === r && e.c === c) && attacks(e, r, c)) out.push(e);
  return out;
}
function blackMoves(e) {
  const p = S.player, out = [];
  const free = (r, c) => onBoard(r, c) && inView(r) && !enemyAt(r, c);
  const isP = (r, c) => r === p.r && c === p.c;
  if (e.type === 'pawn') {
    if (free(e.r - 1, e.c) && !isP(e.r - 1, e.c)) out.push({ r: e.r - 1, c: e.c });
    for (const dc of [-1, 1]) if (isP(e.r - 1, e.c + dc)) out.push({ r: e.r - 1, c: e.c + dc });
    return out;
  }
  if (e.type === 'knight') {
    for (const [a, b] of KNIGHT_JUMPS) if (free(e.r + a, e.c + b)) out.push({ r: e.r + a, c: e.c + b });
    return out;
  }
  for (const [a, b] of dirsFor(e.type)) {
    let r = e.r + a, c = e.c + b;
    while (free(r, c)) { out.push({ r, c }); if (isP(r, c)) break; r += a; c += b; }
  }
  return out;
}
function blackTurn() {
  const p = S.player;
  if (S.grace) { S.grace = 0; emit('grace'); advanceCollapse(); S.blocked = S.state === 'play' && !playerMoves().length; return; }
  const threats = playerThreats();
  const dist = (r, c) => Math.max(Math.abs(r - p.r), Math.abs(c - p.c));
  let best = null, bestScore = -Infinity;
  const sc0 = RULES.script[S.turn++];
  if (sc0 && (!sc0.need || (p.r === sc0.need[0] && p.c === sc0.need[1]))) {
    const e = enemyAt(sc0.f[0], sc0.f[1]);
    if (e && blackMoves(e).some(m => m.r === sc0.t[0] && m.c === sc0.t[1]) && !(sc0.t[0] === p.r && sc0.t[1] === p.c)) best = { e, m: { r: sc0.t[0], c: sc0.t[1] } };
  }
  if (!best) for (const e of S.enemies.values()) {
    for (const m of blackMoves(e)) {
      let sc = Math.random() * 6;
      if (m.r === p.r && m.c === p.c) sc += 1000;
      else {
        const fr = e.r, fc = e.c;
        e.r = m.r; e.c = m.c;
        if (attacks(e, p.r, p.c)) sc += RULES.hunt(p.r);
        e.r = fr; e.c = fc;
        if (threats.has(key(m.r, m.c))) sc -= 40 + PIECES[e.type].value * 5;
        if (threats.has(key(fr, fc))) sc += 18;
        sc += (dist(fr, fc) - dist(m.r, m.c)) * 4;
      }
      if (sc > bestScore) { bestScore = sc; best = { e, m }; }
    }
  }
  if (best) {
    const { e, m } = best;
    S.lastMove = { fr: e.r, fc: e.c, tr: m.r, tc: m.c };
    if (m.r === p.r && m.c === p.c) {          // capture: show the attacker's line first, resolve in tickRules
      S.hit = { e, m, at: S.time + RULES.hitDelay };
      emit('attack', { e, fr: e.r, fc: e.c, tr: m.r, tc: m.c });
      return;
    }
    S.enemies.delete(key(e.r, e.c));
    const fr = e.r, fc = e.c;
    e.r = m.r; e.c = m.c;
    S.enemies.set(key(e.r, e.c), e);
    emit('blackmove', { e, fr, fc });
  }
  advanceCollapse();
  S.blocked = S.state === 'play' && !playerMoves().length;
}
function resolveHit() {
  const { e, m } = S.hit; S.hit = null;
  S.enemies.delete(key(e.r, e.c));
  e.r = m.r; e.c = m.c;
  getCaptured(e);
}

// ---- the void: the board breaks away behind you every turn, never more than 4 ranks behind
function advanceCollapse() {
  if (S.state !== 'play') return;
  const p = S.player;
  const before = voidEdge();
  S.collapse += RULES.voidSpeed(p.r);
  if (p.r - S.collapse > RULES.voidMaxGap) S.collapse = p.r - RULES.voidMaxGap;
  const edge = voidEdge();
  for (let r = before + 1; r <= edge; r++) {
    emit('fall', { r });
    for (let c = 0; c < COLS; c++) {
      const e = enemyAt(r, c);
      if (e) { S.enemies.delete(key(r, c)); S.score += RULES.points.fell; emit('fell', { e, r, c }); }
    }
  }
  if (p.r <= edge) {                                  // caught by the void
    S.lives -= 1; S.combo = 0;
    if (S.lives <= 0) {
      S.state = 'over'; S.msg = 'Swallowed by the void';
      endRun();
      emit('over', { cause: 'void' });
      return;
    }
    S.collapse = p.r - RULES.voidReset;               // knocked back to safety
    emit('voidbite', { lives: S.lives });
  } else if (p.r - S.collapse < RULES.voidNear) emit('rumble');
}

// captured as a piece: drop one step. captured as a pawn: lose a heart. Black then skips one reply.
function getCaptured(e) {
  const p = S.player;
  S.combo = 0;
  if (p.type !== 'pawn') {
    S.grace = 1;
    const from = p.type;
    p.type = RULES.downgrade[p.type];
    emit('hit', { e, from, down: p.type, lives: S.lives });
    S.blocked = !playerMoves().length;
    return;
  }
  S.lives -= 1;
  if (S.lives > 0) {
    S.grace = 1;
    emit('hit', { e, from: 'pawn', down: null, lives: S.lives });
    S.blocked = !playerMoves().length;
    return;
  }
  S.state = 'over';
  S.msg = 'Taken by a ' + e.type;
  S.killer = { type: e.type };
  endRun();
  emit('hit', { e, from: 'pawn', down: null, lives: 0 });
  emit('over', { cause: 'taken', e });
}
function endRun() {
  if (S.best + 1 > BEST) { BEST = S.best + 1; save('cm_best2', BEST); S.newBest = true; }
}

// ---- spawning: each newly revealed rank may bring black pieces
function pickType(n) {
  const pool = RULES.typeWeights(n);
  let t = Math.random() * pool.reduce((s, x) => s + x[1], 0);
  for (const [name, w] of pool) if ((t -= w) < 0) return name;
  return 'pawn';
}
function addEnemy(rk, type) {
  const free = [];
  for (let c = 0; c < COLS; c++) if (!enemyAt(rk, c) && !(S.player.r === rk && S.player.c === c)) free.push(c);
  if (!free.length) return;
  const c = free[Math.floor(Math.random() * free.length)];
  S.enemies.set(key(rk, c), mk(type, rk, c));
}
function spawnRank(rk) {
  if (rk >= RANKS - 1) return;
  const n = rk + 1;
  if (Math.random() < RULES.spawnChance(n)) addEnemy(rk, pickType(n));
  const x = RULES.spawnExtra(n);
  if (x > 0 && Math.random() < x) addEnemy(rk, pickType(n));
}

// ---- your turn
function tryMove(r, c) {
  const p = S.player;
  if (S.state !== 'play') return false;
  if (!playerMoves().some(m => m.r === r && m.c === c)) return false;
  const victim = enemyAt(r, c);
  S.moves += 1;
  if (isDanger(p.r, p.c) && !isDanger(r, c) && S.moves - S.lastClose >= RULES.closeCallEvery) {
    S.lastClose = S.moves; S.closeCalls += 1;
    emit('closecall', { fr: p.r, fc: p.c, r, c, attackers: attackersOf(p.r, p.c).map(e => ({ r: e.r, c: e.c })) });
  }
  const fromR = p.r, fromC = p.c, fromType = p.type;
  if (victim) {
    S.enemies.delete(key(r, c));
    S.combo += 1; S.captures += 1;
    const pts = PIECES[victim.type].value * RULES.points.capture * S.combo;
    S.score += pts;
    S.taken[victim.type] += 1; S.maxCombo = Math.max(S.maxCombo, S.combo);
    let became = null;
    if (victim.type !== 'pawn' && victim.type !== p.type) { p.type = victim.type; became = victim.type; noteTop(p.type); }  // you become what you take
    emit('capture', { victim, r, c, pts, combo: S.combo, fromR, fromC, became, fromType });
  } else { S.combo = 0; emit('move', { r, c, fromR, fromC }); }
  p.r = r; p.c = c;

  if (p.type !== 'queen' && isGoldRank(r) && r > S.best) {
    const was = p.type;
    p.type = 'queen'; S.score += RULES.points.promote; S.queens += 1; noteTop('queen');
    emit('promote', { r, c, from: was });
  }
  if (p.r > S.best) {
    const old = S.best, livesBefore = S.lives;
    for (let k = S.best + 1; k <= p.r; k++) if ((k + 1) % RULES.lifeEvery === 0 && S.lives < RULES.lives) S.lives++;
    S.score += RULES.points.rank * (p.r - S.best); S.best = p.r;
    emit('advance', { from: old, to: p.r, lifeGained: S.lives > livesBefore });
  }
  for (let rk = S.revealed + 1; rk <= topRank(); rk++) spawnRank(rk);
  S.revealed = Math.max(S.revealed, topRank());
  for (const [k, e] of S.enemies) if (e.r < camTarget()) S.enemies.delete(k);

  if (p.r === RANKS - 1) {
    S.state = 'won';
    if (RANKS > BEST) { BEST = RANKS; save('cm_best2', BEST); S.newBest = true; }

    const sw = 64, sh = 36, sx = px + pw - 32 - sw, sy = y + 14;
    ctx.fillStyle = on > 0.5 ? T.accent : (T.lightBg ? '#cfcdc5' : 'rgba(255,255,255,.2)');
    ctx.globalAlpha = k * (0.5 + 0.5 * on) + (on > 0.5 ? 0 : k * 0.3); rrect(sx, sy, sw, sh, sh / 2); ctx.fill(); ctx.globalAlpha = k;
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(lerp(sx + sh / 2, sx + sw - sh / 2, on), sy + sh / 2, sh / 2 - 4, 0, TAU); ctx.fill();
    hit(px + 16, y, pw - 32, 64, () => { toggleSetting(o.id); SFX.ui(); }, 'set_' + o.id);
  });
  let y = py + 84 + rows * 76 + 4;
  if (V.update) { button('set_upd', px + 16, y, pw - 32, 50, 'Update to ' + V.update.version, applyUpdate, { px: 18 }); y += 64; }
  if (inRun) { button('set_quit', px + 16, y, pw - 32, 50, 'End run', () => { closeSettings(); if (S.moves > 0) { endRun(); recordRun('quit', null); } V.screen = 'menu'; S.state = 'menu'; }, { secondary: true, px: 18 }); y += 64; }
  button('set_done', px + 16, y + 8, pw - 32, 56, 'DONE', closeSettings, { px: 22 });
  ctx.restore();
}
function drawPaused() {
  const W = L.W, H = L.H;
  ctx.fillStyle = '#000'; ctx.globalAlpha = 0.6; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  txt('PAUSED', W / 2, H * 0.42, 48, '#ffffff', { align: 'center' });
  hit(0, 0, W, H, resume, 'pause_bg');
  button('resume', 32, H * 0.5, W - 64, 62, 'RESUME', resume, { pulse: true, px: 26 });
}

function draw() {
  V.rects = [];
  ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = T.bg; ctx.fillRect(0, 0, L.W, L.H);
  const statsFull = SV.open && SV.t >= 0.25 && !SV.closing;
  if (!statsFull) {
    if (S.state === 'menu') drawMenu();
    else {
      drawGame();
      if ((S.state === 'over' || S.state === 'won') && V.death && V.death.t >= V.endAt) drawEnd();
      if (V.paused && S.state === 'play') drawPaused();
    }
  }
  if (SV.open) drawStats();
  if (V.settings || V.settingsT > 0) drawSettings();
  if (!L.portrait && L.H < 560) drawRotate();
}
function drawRotate() {
  V.rects = [{ x: 0, y: 0, w: L.W, h: L.H, act: () => {}, id: 'rot' }];
  ctx.fillStyle = T.bg; ctx.globalAlpha = 0.96; ctx.fillRect(0, 0, L.W, L.H); ctx.globalAlpha = 1;
  const a = Math.sin(V.clock * 2) * 0.5 - 0.5;
  ctx.save(); ctx.translate(L.W / 2, L.H * 0.4); ctx.rotate(a);
  ctx.lineWidth = 5; ctx.strokeStyle = T.hud; rrect(-30, -50, 60, 100, 12); ctx.stroke();
  ctx.restore();
  drawPiece(ctx, 'pawn', 'w', L.W / 2, L.H * 0.4, 44);
  txt('Turn your phone upright', L.W / 2, L.H * 0.4 + 90, 26, T.hud, { align: 'center' });
}

// ======================================= 9. INPUT =======================================
function startRun() { unlockAudio(); newGame(); V.screen = 'play'; SFX.start(); buzz(10); }
function openSettings() { V.settings = true; SFX.ui(); }
function closeSettings() { V.settings = false; }
function resume() { V.paused = false; unlockAudio(); SFX.ui(); }
function cycleTheme() {
  setTheme(THEME_IDS[(THEME_IDS.indexOf(themeId) + 1) % THEME_IDS.length]);
  V.toast = { text: T.name, life: 1.2 }; SFX.ui(); buzz(8);
}
function applyUpdate() {
  if (!V.update) return;
  try { if (NAV && NAV.clearAppBadge) NAV.clearAppBadge(); } catch (e) {}
  try { location.replace('./?v=' + encodeURIComponent(V.update.version)); } catch (e) {}
}
function boardTap(x, y) {
  if (S.state !== 'play' || V.death) return;
  if (V.slow > 0) { V.slow = 0; }            // a tap skips slow-mo
  if (!playerTurn()) return;
  const moves = playerMoves(); if (!moves.length) return;
  const CS = L.CS;
  const c = Math.floor((x - L.bx) / CS), r = Math.floor(V.cam + (L.Y0 - y) / CS);
  let pick = moves.find(m => m.r === r && m.c === c);
  if (!pick) {          // forgiving taps: nearest legal square within ~0.7 of a square
    let best = null, bd = CS * 0.7;
    for (const m of moves) { const cc = cellCenter(m.r, m.c), d = Math.hypot(cc.x - x, cc.y - y); if (d < bd) { bd = d; best = m; } }
    pick = best;
  }
  if (pick) tryMove(pick.r, pick.c);
}
function onDown(x, y) {
  unlockAudio();
  for (let i = V.rects.length - 1; i >= 0; i--) {
    const b = V.rects[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      if (b.id === 'swallow' || b.id === 'set_panel') return;
      V.press = { id: b.id, t: 0 }; b.act(); return;
    }
  }
  if (S.state === 'play') boardTap(x, y);
}
const PTR = { id: null, y0: 0, x: 0, y: 0, moved: false, lastY: 0, lastT: 0, vy: 0 };
function rubber(over) { return over * 0.45 / (1 + over / 500); }
if (canvas && canvas.addEventListener) {
  const pos = (e) => { const b = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 }; return [e.clientX - b.left, e.clientY - b.top]; };
  canvas.addEventListener('pointerdown', (e) => {
    if (e.preventDefault) e.preventDefault();
    const [x, y] = pos(e);
    if (SV.open && !SV.closing && !SV.confirm && y > SV.top) {        // stats page: start a drag, decide tap vs scroll on release
      unlockAudio();
      Object.assign(PTR, { id: e.pointerId, y0: y, x, y, moved: false, lastY: y, lastT: performance.now(), vy: 0 });
      SV.drag = { y0: SV.y }; SV.vy = 0;
      try { canvas.setPointerCapture(e.pointerId); } catch (er) {}
      return;
    }
    onDown(x, y);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!SV.drag || e.pointerId !== PTR.id) return;
    const [x, y] = pos(e), now = performance.now();
    if (Math.abs(y - PTR.y0) > 8) PTR.moved = true;
    if (!PTR.moved) return;
    const max = Math.max(0, SV.contentH - SV.viewH);
    let ny = SV.drag.y0 - (y - PTR.y0);
    if (ny < 0) ny = -rubber(-ny); else if (ny > max) ny = max + rubber(ny - max);
    SV.y = ny; SV.bar = 1;
    const dtm = now - PTR.lastT;
    if (dtm > 0) { const inst = -(y - PTR.lastY) / (dtm / 1000); PTR.vy = PTR.vy * 0.25 + inst * 0.75; }
    PTR.lastY = y; PTR.lastT = now; PTR.x = x; PTR.y = y;
  });
  const end = (e, cancelled) => {
    if (!SV.drag || e.pointerId !== PTR.id) return;
    SV.drag = null; PTR.id = null;
    if (!PTR.moved) { if (!cancelled) onDown(PTR.x, PTR.y0); return; }
    SV.vy = performance.now() - PTR.lastT < 90 ? clamp(PTR.vy, -5000, 5000) : 0;
  };
  canvas.addEventListener('pointerup', (e) => end(e, false));
  canvas.addEventListener('pointercancel', (e) => end(e, true));
  canvas.addEventListener('wheel', (e) => {
    if (!SV.open) return;
    if (e.preventDefault) e.preventDefault();
    SV.y = clamp(SV.y + e.deltaY, 0, Math.max(0, SV.contentH - SV.viewH)); SV.vy = 0; SV.bar = 1;
  }, { passive: false });
}
if (HAS_DOC && document.addEventListener) {
  const stop = (e) => { if (e.cancelable) e.preventDefault(); };
  document.addEventListener('touchmove', stop, { passive: false });
  document.addEventListener('touchstart', (e) => { if (e.touches && e.touches.length > 1) stop(e); }, { passive: false });
  document.addEventListener('touchend', (e) => { unlockAudio(); stop(e); }, { passive: false });   // no double-tap zoom, no ghost clicks
  document.addEventListener('gesturestart', stop, { passive: false });
  document.addEventListener('dblclick', stop, { passive: false });
  document.addEventListener('contextmenu', stop);
  document.addEventListener('selectstart', stop);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (S.state === 'play' && !V.death) V.paused = true; try { AC && AC.suspend && AC.suspend(); } catch (e) {} }
    else { try { AC && AC.resume && AC.resume(); } catch (e) {} checkUpdate(); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (SV.open) { if (SV.confirm) SV.confirm = false; else closeStats(); return; } V.settings = !V.settings; return; }
    if ((e.key === 'Enter' || e.key === ' ') && (S.state === 'menu' || (S.state !== 'play' && V.overT > 0.5))) startRun();
  });
}
if (HAS_WIN && window.addEventListener) {
  const re = () => layout();
  window.addEventListener('resize', re);
  window.addEventListener('orientationchange', () => setTimeout(re, 120));
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', re);
  window.addEventListener('pagehide', () => { if (S && S.state === 'play') V.paused = true; });
}

// =================================== 10. UPDATE CHECK ===================================
let lastUpdCheck = 0;
function checkUpdate(force) {
  if (typeof fetch !== 'function') return;
  const now = Date.now();
  if (!force && now - lastUpdCheck < 60000) return;
  lastUpdCheck = now;
  try {
    fetch('version.json?t=' + now, { cache: 'no-store' })
      .then(r => r && r.ok ? r.json() : null)
      .then(j => {
        if (!j || !j.version) return;
        if (String(j.version) !== APP_VERSION) {
          V.update = { version: String(j.version), notes: String(j.notes || '').slice(0, 160) };
          try { if (NAV && NAV.setAppBadge) NAV.setAppBadge(1).catch(() => {}); } catch (e) {}
        } else {
          V.update = null;
          try { if (NAV && NAV.clearAppBadge) NAV.clearAppBadge().catch(() => {}); } catch (e) {}
        }
      }).catch(() => {});
  } catch (e) {}
}

// ===================================== 11. LOOP + BOOT ==================================
function update(dt) {
  dt = Math.max(0, dt);
  V.clock += dt;
  if (V.press) { V.press.t += dt; if (V.press.t > 0.15) V.press = null; }
  for (const o of SETTINGS) V.sw[o.id] += ((SET[o.id] ? 1 : 0) - V.sw[o.id]) * Math.min(1, dt * 14);
  V.settingsT = V.settings ? Math.min(0.22, V.settingsT + dt) : Math.max(0, V.settingsT - dt * 1.5);
  if (V.toast) { V.toast.life -= dt; if (V.toast.life <= 0) V.toast = null; }
  updateStatsScroll(dt);
  if (!S || S.state === 'menu') return;
  const hold = V.settings || V.paused;
  if (!hold) tickRules(dt);
  // visual time: slow-mo after captures, freeze on death
  let vdt = dt;
  if (V.slow > 0) { V.slow -= dt; vdt *= 0.3; }
  if (V.freeze > 0) { V.freeze -= dt; vdt = 0; }
  if (V.death) { V.death.t += dt; if (V.death.t >= V.endAt) V.overT += dt; }
  if (hold) vdt = 0;
  V.flash = Math.max(0, V.flash - dt * 2.2);
  V.edgeGlow = Math.max(0, V.edgeGlow - dt);
  V.shake = Math.max(0, V.shake - dt * 3.2);
  const camT = camTarget(); V.cam += (camT - V.cam) * (1 - Math.exp(-vdt * 9));
  if (Math.abs(camT - V.cam) < 0.001) V.cam = camT;
  animPiece(S.player, vdt, false);
  for (const e of S.enemies.values()) animPiece(e, vdt, true);
  if (V.pop) { V.pop.t += vdt; if (V.pop.t > 0.4) V.pop = null; }
  if (V.heartCrack) { V.heartCrack.t += dt * 1.4; if (V.heartCrack.t > 1) V.heartCrack = null; }
  if (V.banner) { V.banner.t += dt; if (V.banner.t > V.banner.life) V.banner = null; }
  for (const g of V.rings) g.t += vdt; V.rings = V.rings.filter(g => g.t < 0.5);
  for (const l of V.lines) l.t += dt; V.lines = V.lines.filter(l => l.t < l.dur);
  for (const g of V.ghosts) { g.t += vdt; if (!g.strike) { g.x += (g.vx || 0) * vdt; g.y += (g.vy || 0) * vdt; g.vy = (g.vy || 0) + (g.fall ? 500 : 900) * vdt; g.rot += (g.vr || 0) * vdt; } }
  V.ghosts = V.ghosts.filter(g => g.t < g.life);
  for (const d of V.debris) { if (d.delay > 0) { d.delay -= vdt; continue; } d.vy += 700 * vdt; d.y += d.vy * vdt; d.rot += d.vr * vdt; d.life -= vdt * 1.1; }
  V.debris = V.debris.filter(d => d.life > 0);
  for (const q of V.parts) { q.x += q.vx * vdt; q.y += q.vy * vdt; q.vy += q.g * vdt; q.vx *= 1 - vdt * 1.5; q.rot += q.vr * vdt; q.life -= vdt; }
  V.parts = V.parts.filter(q => q.life > 0);
  for (const f of V.floats) { f.y -= 50 * vdt; f.life -= vdt; }
  V.floats = V.floats.filter(f => f.life > 0);
  if (V.embers.length < 26 && Math.random() < vdt * 20) V.embers.push({ x: Math.random() * L.W, y: 10 + Math.random() * 40, vy: -(20 + Math.random() * 40), life: 1 });
  for (const e of V.embers) { e.y += e.vy * vdt; e.life -= vdt * 0.9; }
  V.embers = V.embers.filter(e => e.life > 0);
  updateTips(dt);
}

function updateStatsScroll(dt) {
  if (!SV.open) return;
  SV.age += dt;
  if (SV.closing) { SV.t -= dt; if (SV.t <= 0) { SV.open = false; SV.closing = false; SV.t = 0; } }
  else SV.t = Math.min(0.25, SV.t + dt);
  SV.confirmT = SV.confirm ? Math.min(0.2, SV.confirmT + dt) : Math.max(0, SV.confirmT - dt * 1.5);
  const max = Math.max(0, SV.contentH - SV.viewH);
  if (!SV.drag) {
    if (Math.abs(SV.vy) > 5) { SV.y += SV.vy * dt; SV.vy *= Math.exp(-dt * 3.2); SV.bar = 1; } else SV.vy = 0;
    const k = 1 - Math.exp(-dt * 16);
    if (SV.y < 0) { SV.vy *= Math.exp(-dt * 25); SV.y += -SV.y * k; if (SV.y > -0.3) SV.y = 0; }
    else if (SV.y > max) { SV.vy *= Math.exp(-dt * 25); SV.y += (max - SV.y) * k; if (SV.y - max < 0.3) SV.y = max; }
  }
  SV.bar = Math.max(0, SV.bar - dt * 1.2);
}
layout();
setTheme(themeId);
newGame();
S.state = 'menu';
let lastT = performance.now();
function loop(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  update(dt);
  draw();
  if (!(HAS_WIN && window.__stop)) requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
checkUpdate(true);
if (HAS_DOC && document.fonts && document.fonts.load) {
  try { ['900 20px Cinzel', '20px "Lilita One"', '900 20px Nunito', '800 20px Orbitron', '800 20px Outfit'].forEach(f => document.fonts.load(f).catch(() => {})); } catch (e) {}
}
</script>
